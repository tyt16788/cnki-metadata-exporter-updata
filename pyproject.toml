[project]
name = "cnki-metadata-exporter"
version = "0.2.0"
description = "Reusable Playwright workflow for exporting, merging, and deduplicating CNKI search-result metadata"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yao" }]
requires-python = ">=3.11"
dependencies = ["playwright>=1.50,<2"]
keywords = ["CNKI", "metadata", "bibliography", "Playwright", "literature review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/JYao-Chen/cnki-metadata-exporter"
Issues = "https://github.com/JYao-Chen/cnki-metadata-exporter/issues"

[project.scripts]
cnki-metadata-exporter = "cnki_metadata_exporter.cli:main"
cnki-native-export = "cnki_metadata_exporter.native_export:main"
cnki-merge-metadata = "cnki_metadata_exporter.merge_metadata:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnki_metadata_exporter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
